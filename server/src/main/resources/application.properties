spring.application.name=finance-tracker
# Port: override with PORT env var if needed (e.g. on Render/Railway)
server.port=${PORT:8080}
# MongoDB: set MONGODB_URI for Atlas, otherwise local MongoDB is used.
# Example Atlas value: mongodb+srv://<user>:<password>@<cluster>/<db>?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/finance_tracker}
# JWT: set JWT_SECRET to a random string of at least 32 characters in production,
# so tokens stay valid across restarts. If it is missing/short, a random key is
# generated at startup instead (tokens then expire on restart). Never commit a real secret.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
